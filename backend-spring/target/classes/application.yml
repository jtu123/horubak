server:
  port: 8080

spring:
  application:
    name: moment-backend

  datasource:
    url: jdbc:mysql://localhost:3306/capstone_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true