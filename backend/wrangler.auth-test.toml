name = "horubak-auth-test"
main = "cloudflare/auth-worker.ts"
compatibility_date = "2026-11-10"
workers_dev = false
preview_urls = false

[vars]
APP_ORIGIN = "https://horubak.pages.dev"

[[durable_objects.bindings]]
name = "AUTH_STORE"
class_name = "HorubakAuthStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["HorubakAuthStore"]

# Keep API logs on Cloudflare without recording OAuth query parameters.
[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false

[observability.issues]
enabled = false
